<!DOCTYPE html>
<html>
<head>
    <title>Historial de Visitas</title>

    <style>
        body {
            font-family: Arial;
            background-color: #eef2f7;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        th {
            background-color: #1e88e5;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background-color: #f5f9ff;
        }

        .btn-volver {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 12px;
            background-color: #555;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>

</head>
<body>

<a href="/" class="btn-volver">⬅ Volver</a>

<h1>📊 Historial de Visitas</h1>

<!-- TABLA -->
<div class="card">

    <table>

        <thead>
            <tr>
                <th>Contrato</th>
                <th>Proyecto</th>
                <th>Fecha</th>
                <th>Supervisor</th>
                <th>Residente</th>
                <th>Observaciones</th>
                <th>Acta</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            {% for v in visitas %}

            <tr>

                <!-- DATOS -->
                <td>{{ v[2] }}</td>
                <td>{{ v[1] }}</td>
                <td>{{ v[3] }}</td>
                <td>{{ v[4] }}</td>
                <td>{{ v[5] }}</td>

                <!-- OBSERVACIONES -->
                <td class="obs">
                    {{ v[6] }}
                </td>

                <!-- ACTA -->
                <td>

                    {% if v[7] %}

                        <a
                            href="/{{ v[7] }}"
                            target="_blank"
                            class="btn btn-primary btn-sm"
                        >
                            📄 Ver acta
                        </a>

                    {% else %}

                        <span class="text-muted">
                            Sin archivo
                        </span>

                    {% endif %}

                </td>

                <!-- ACCIONES -->
                <td>

                    <a
                        href="{{ url_for('eliminar_visita', id_visita=v[0]) }}"
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('¿Eliminar esta visita?')"
                    >
                        🗑 Eliminar
                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
