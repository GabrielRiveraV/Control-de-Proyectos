<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#eef2f7; }
        .login-card { border:0; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.12); }
        .brand-logo { width:100%; max-width:300px; display:block; margin:0 auto 18px; }
        .subtitle { color:#455a64; font-size:14px; text-align:center; margin-top:-8px; margin-bottom:20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card">
                    <div class="card-body p-4">
                        <img src="{{ url_for('static', filename='img/logo_centro.png') }}" alt="Centro" class="brand-logo">
                        <h1 class="h4 text-center mb-2">Control de Obras</h1>
                        <div class="subtitle">Contraloria Municipal</div>
                        <form method="POST">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" name="usuario" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contrasena</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <div class="d-grid">
                                <button class="btn btn-primary">Ingresar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
